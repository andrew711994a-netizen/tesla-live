name: Backtest

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["bot/**", ".github/workflows/backtest.yml"]

permissions:
  contents: write

concurrency:
  group: backtest
  cancel-in-progress: true

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: bot/requirements.txt
      - run: pip install -r bot/requirements.txt
      - name: Run backtest
        run: |
          python -m bot.backtest
          python -m bot.backtest --tf 1h
          python -m bot.research
          cat reports/backtest.md reports/backtest_1h.md reports/research.md >> "$GITHUB_STEP_SUMMARY"
      - name: Save report
        run: |
          git config user.name "backtest-bot"
          git config user.email "backtest-bot@users.noreply.github.com"
          git add reports/
          git diff --cached --quiet || git commit -m "Update backtest report [skip ci]"
          git pull --rebase origin main && git push origin HEAD:main
