name: Scalp research

# Έρευνα scalping με πραγματικά κεριά 1 λεπτού της Capital.com (bot/scalp.py).
# Μόνο ανάγνωση τιμών: δεν ανοίγει θέσεις. Τρέχει μόνο χειροκίνητα.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scalp-research
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: bot/requirements.txt
      - run: pip install -r bot/requirements.txt
      - name: Run scalping research
        env:
          CAPITAL_API_KEY: ${{ secrets.CAPITAL_API_KEY }}
          CAPITAL_IDENTIFIER: ${{ secrets.CAPITAL_IDENTIFIER }}
          CAPITAL_PASSWORD: ${{ secrets.CAPITAL_PASSWORD }}
          CAPITAL_ENV: demo
        run: |
          python -m bot.scalp
          cat reports/scalp.md >> "$GITHUB_STEP_SUMMARY"
      - name: Save report
        run: |
          git config user.name "backtest-bot"
          git config user.email "backtest-bot@users.noreply.github.com"
          git add reports/
          git diff --cached --quiet && exit 0
          git commit -m "Update scalping report [skip ci]"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && break; sleep 5; done
