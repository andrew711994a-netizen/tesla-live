name: Scalp research

# Έρευνα scalping με πραγματικά κεριά 1 λεπτού της Capital.com (bot/scalp.py· bot/scalp5.py για σήματα σε κεριά 5′).
# Μόνο ανάγνωση τιμών: δεν ανοίγει θέσεις. Τρέχει μόνο χειροκίνητα.
on:
  workflow_dispatch:
    inputs:
      module:
        description: "Έρευνα: scalp (κεριά 1′) ή scalp5 (σήματα σε κεριά 5′, μοτίβα)"
        type: choice
        options: [scalp, scalp5]
        default: scalp
      days:
        description: "Ημέρες ιστορικού (κενό = 120)"
        type: string
        default: ""
      instruments:
        description: "Σύμβολα χωρισμένα με κόμμα (κενό = όλα), π.χ. US100,US500,TSLA"
        type: string
        default: ""
      strategies:
        description: "Τεχνικές (κενό = όλες) · scalp: orb5,orb15,ema921,ema513,vwap2,vwap25 · scalp5: engulf,hammer,pullback,star,inside,double,momentum,trendday,breakout"
        type: string
        default: ""
      out:
        description: "Όνομα αναφοράς στο reports/ (κενό = όνομα της έρευνας)"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: scalp-research-${{ inputs.out || inputs.module }}   # διαφορετικές αναφορές τρέχουν παράλληλα
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: bot/requirements.txt
      - run: pip install -r bot/requirements.txt
      - name: Run scalping research
        env:
          CAPITAL_API_KEY: ${{ secrets.CAPITAL_API_KEY }}
          CAPITAL_IDENTIFIER: ${{ secrets.CAPITAL_IDENTIFIER }}
          CAPITAL_PASSWORD: ${{ secrets.CAPITAL_PASSWORD }}
          CAPITAL_ENV: demo
          SCALP_DAYS: ${{ inputs.days }}
          SCALP_INSTRUMENTS: ${{ inputs.instruments }}
          SCALP_STRATS: ${{ inputs.strategies }}
          SCALP_OUT: ${{ inputs.out }}
          MODULE: ${{ inputs.module }}
        run: |
          case "$MODULE" in scalp|scalp5) ;; *) echo "Άγνωστη έρευνα: $MODULE"; exit 1;; esac
          python -m "bot.$MODULE"
          cat "reports/${SCALP_OUT:-$MODULE}.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Save report
        run: |
          git config user.name "backtest-bot"
          git config user.email "backtest-bot@users.noreply.github.com"
          git add reports/
          git diff --cached --quiet && exit 0
          git commit -m "Update scalping report [skip ci]"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && break; sleep 5; done
