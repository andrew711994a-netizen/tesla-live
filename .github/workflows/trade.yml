name: Trade

# Το GitHub συχνά ξεκινά τις προγραμματισμένες εκτελέσεις με καθυστέρηση (ή τις παραλείπει). Γι' αυτό:
# - ξεκινά ~9:05 και 9:15 Νέα Υόρκη, κατεβάζει τα δεδομένα και ΠΕΡΙΜΕΝΕΙ ως τις 9:31 για τις εντολές,
# - από τις 9:35 ως τις ~10:50 ξαναδοκιμάζει κάθε 15 λεπτά (εφεδρεία).
# Οι ώρες UTC καλύπτουν θερινή και χειμερινή ώρα· το πρόγραμμα ελέγχει μόνο του την ώρα και κάνει
# συναλλαγές μία φορά τη μέρα (οι επόμενες εκτελέσεις τελειώνουν αμέσως, εκτός αν η πρώτη απέτυχε).
on:
  schedule:
    - cron: "5,15,35,50 13 * * 1-5"
    - cron: "5,15,20,35,50 14 * * 1-5"
    - cron: "5,20,35,50 15 * * 1-5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Μόνο δοκιμή, χωρίς εντολές"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: trade
  cancel-in-progress: false

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 50   # έως 35′ αναμονή για το άνοιγμα της αγοράς
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # το πιο πρόσφατο ημερολόγιο, ακόμα κι αν το run περίμενε στην ουρά
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: bot/requirements.txt
      - run: pip install -r bot/requirements.txt
      - name: Run bot
        env:
          CAPITAL_API_KEY: ${{ secrets.CAPITAL_API_KEY }}
          CAPITAL_IDENTIFIER: ${{ secrets.CAPITAL_IDENTIFIER }}
          CAPITAL_PASSWORD: ${{ secrets.CAPITAL_PASSWORD }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          CAPITAL_ENV: ${{ vars.CAPITAL_ENV || 'demo' }}
          BOT_ENABLED: ${{ vars.BOT_ENABLED || 'true' }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || vars.DRY_RUN || 'true' }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
          CHECK_EPICS: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
        run: python -m bot.live
      - name: Save journal
        if: always()
        run: |
          [ -d journal ] || exit 0
          git config user.name "trading-bot"
          git config user.email "trading-bot@users.noreply.github.com"
          git add journal/
          git diff --cached --quiet && exit 0
          git commit -m "Journal $(date -u +%F) [skip ci]"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && break; sleep 5; done
