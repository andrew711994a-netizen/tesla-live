name: Trade

# Το bot ξεκινά ~9:05–9:25 Νέα Υόρκη, κατεβάζει τα δεδομένα και ΠΕΡΙΜΕΝΕΙ ως τις 9:31 για τις εντολές.
# Κύρια εκκίνηση: εξωτερική κλήση workflow_dispatch με auto=true (καθημερινή υπενθύμιση του Claude), γιατί
# ο προγραμματισμός του GitHub δεν είναι αξιόπιστος (αργεί ή παραλείπει εκτελέσεις). Τα cron μένουν ως εφεδρεία:
# ~9:05/9:15 και μετά κάθε 15 λεπτά ως τις ~10:50 (οι ώρες UTC καλύπτουν θερινή και χειμερινή ώρα).
# Το πρόγραμμα ελέγχει μόνο του την ώρα και κάνει συναλλαγές μία φορά τη μέρα (οι επόμενες εκτελέσεις
# τελειώνουν αμέσως, εκτός αν η πρώτη απέτυχε).
# Δύο λογαριασμοί δίπλα δίπλα: το demo (job «trade», ημερολόγιο journal/) και ο πραγματικός (job «live»,
# ημερολόγιο journal/live/). Ο πραγματικός κάνει εντολές μόνο όταν το bot/config.json έχει "live": {"orders": true}·
# αλλιώς μόνο δοκιμή. Χωρίς τα secrets CAPITAL_LIVE_* τελειώνει αμέσως.
on:
  schedule:
    - cron: "5,15,35,50 13 * * 1-5"
    - cron: "5,15,20,35,50 14 * * 1-5"
    - cron: "5,20,35,50 15 * * 1-5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Μόνο δοκιμή, χωρίς εντολές (αγνοείται με το «Όπως το πρόγραμμα»)"
        type: boolean
        default: true
      auto:
        description: "Όπως το πρόγραμμα: ίδιοι έλεγχοι ώρας/αργίας, μία φορά τη μέρα, DRY_RUN από τις Variables"
        type: boolean
        default: false
      account:
        description: "Χειροκίνητη εκτέλεση: ποιος λογαριασμός (ο πραγματικός πάντα μόνο δοκιμή)· το «Όπως το πρόγραμμα» τρέχει και τους δύο"
        type: choice
        options: [demo, live, both]
        default: demo

permissions:
  contents: write

concurrency:
  group: trade
  cancel-in-progress: false

jobs:
  trade:
    if: github.event_name != 'workflow_dispatch' || inputs.auto || inputs.account != 'live'
    runs-on: ubuntu-latest
    timeout-minutes: 50   # έως 35′ αναμονή για το άνοιγμα της αγοράς
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # το πιο πρόσφατο ημερολόγιο, ακόμα κι αν το run περίμενε στην ουρά
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: bot/requirements.txt
      - run: pip install -r bot/requirements.txt
      - name: Run bot
        env:
          CAPITAL_API_KEY: ${{ secrets.CAPITAL_API_KEY }}
          CAPITAL_IDENTIFIER: ${{ secrets.CAPITAL_IDENTIFIER }}
          CAPITAL_PASSWORD: ${{ secrets.CAPITAL_PASSWORD }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          CAPITAL_ENV: ${{ vars.CAPITAL_ENV || 'demo' }}
          BOT_ENABLED: ${{ vars.BOT_ENABLED || 'true' }}
          # Χειροκίνητη εκτέλεση (όχι «Όπως το πρόγραμμα»): αγνοεί ώρα/αργία/μία φορά τη μέρα και ελέγχει τα σύμβολα
          DRY_RUN: ${{ (github.event_name == 'workflow_dispatch' && !inputs.auto) && inputs.dry_run || vars.DRY_RUN || 'true' }}
          FORCE: ${{ (github.event_name == 'workflow_dispatch' && !inputs.auto) && 'true' || 'false' }}
          CHECK_EPICS: ${{ (github.event_name == 'workflow_dispatch' && !inputs.auto) && 'true' || 'false' }}
        run: python -m bot.live
      - name: Save journal
        if: always()
        run: |
          [ -d journal ] || exit 0
          git config user.name "trading-bot"
          git config user.email "trading-bot@users.noreply.github.com"
          git add journal/
          git diff --cached --quiet && exit 0
          git commit -m "Journal $(date -u +%F) [skip ci]"
          for i in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            sleep 5
          done
          echo "::error::Το ημερολόγιο δεν αποθηκεύτηκε στο GitHub (push απέτυχε 3 φορές)."
          exit 1

  live:
    if: github.event_name != 'workflow_dispatch' || inputs.auto || inputs.account != 'demo'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: bot/requirements.txt
      - run: pip install -r bot/requirements.txt
      - name: Run bot (live)
        env:
          CAPITAL_API_KEY: ${{ secrets.CAPITAL_LIVE_API_KEY }}
          CAPITAL_IDENTIFIER: ${{ secrets.CAPITAL_LIVE_IDENTIFIER }}
          CAPITAL_PASSWORD: ${{ secrets.CAPITAL_LIVE_PASSWORD }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          CAPITAL_ENV: live
          ALLOW_LIVE: I_UNDERSTAND_THE_RISK
          BOT_ENABLED: ${{ vars.BOT_ENABLED || 'true' }}
          # Χειροκίνητη εκτέλεση: πάντα δοκιμή. Πρόγραμμα: εντολές μόνο αν το επιτρέπει το config.json (live.orders)
          # και δεν έχει οριστεί η μεταβλητή LIVE_DRY_RUN = true (φρένο από το GitHub).
          DRY_RUN: ${{ (github.event_name == 'workflow_dispatch' && !inputs.auto) && 'true' || vars.LIVE_DRY_RUN || 'false' }}
          FORCE: ${{ (github.event_name == 'workflow_dispatch' && !inputs.auto) && 'true' || 'false' }}
          CHECK_EPICS: ${{ (github.event_name == 'workflow_dispatch' && !inputs.auto) && 'true' || 'false' }}
        run: python -m bot.live
      - name: Save journal
        if: always()
        run: |
          [ -d journal/live ] || exit 0
          git config user.name "trading-bot"
          git config user.email "trading-bot@users.noreply.github.com"
          git add journal/live/
          git diff --cached --quiet && exit 0
          git commit -m "Journal live $(date -u +%F) [skip ci]"
          for i in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            sleep 5
          done
          echo "::error::Το ημερολόγιο του live δεν αποθηκεύτηκε στο GitHub (push απέτυχε 3 φορές)."
          exit 1
