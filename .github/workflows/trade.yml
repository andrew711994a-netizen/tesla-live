name: Trade

# Κάθε εργάσιμη ~9:40 Νέα Υόρκη. Δύο ώρες UTC για θερινή/χειμερινή ώρα·
# το πρόγραμμα ελέγχει μόνο του την ώρα και τρέχει μία φορά.
on:
  schedule:
    - cron: "40 13 * * 1-5"
    - cron: "40 14 * * 1-5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Μόνο δοκιμή, χωρίς εντολές"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: trade
  cancel-in-progress: false

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: bot/requirements.txt
      - run: pip install -r bot/requirements.txt
      - name: Run bot
        env:
          CAPITAL_API_KEY: ${{ secrets.CAPITAL_API_KEY }}
          CAPITAL_IDENTIFIER: ${{ secrets.CAPITAL_IDENTIFIER }}
          CAPITAL_PASSWORD: ${{ secrets.CAPITAL_PASSWORD }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          CAPITAL_ENV: ${{ vars.CAPITAL_ENV || 'demo' }}
          BOT_ENABLED: ${{ vars.BOT_ENABLED || 'true' }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || vars.DRY_RUN || 'true' }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
        run: python -m bot.live
