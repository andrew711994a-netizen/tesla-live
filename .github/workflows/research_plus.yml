name: Research plus

# Έρευνα κερδοφορίας (bot/research_plus.py). Τρέχει μόνο χειροκίνητα· δεν αλλάζει τίποτα στο bot.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: research-plus
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: bot/requirements.txt
      - run: pip install -r bot/requirements.txt
      - name: Run research
        run: |
          python -m bot.research_plus
          cat reports/research_plus.md >> "$GITHUB_STEP_SUMMARY"
      - name: Save report
        run: |
          git config user.name "backtest-bot"
          git config user.email "backtest-bot@users.noreply.github.com"
          git add reports/
          git diff --cached --quiet && exit 0
          git commit -m "Update research report [skip ci]"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && break; sleep 5; done
