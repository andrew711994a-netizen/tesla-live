name: Research plus

# Έρευνες κερδοφορίας (bot/research_*.py). Τρέχουν μόνο χειροκίνητα· δεν αλλάζουν τίποτα στο bot.
on:
  workflow_dispatch:
    inputs:
      study:
        description: "Ποια έρευνα"
        type: choice
        options: [research_plus, research_exits, research_entries]
        default: research_plus

permissions:
  contents: write

concurrency:
  group: research-${{ inputs.study }}
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      STUDY: ${{ inputs.study }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: bot/requirements.txt
      - run: pip install -r bot/requirements.txt
      - name: Run research
        run: |
          case "$STUDY" in research_plus|research_exits|research_entries) ;; *) echo "Άγνωστη έρευνα: $STUDY"; exit 1;; esac
          python -m "bot.$STUDY"
          cat "reports/$STUDY.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Save report
        run: |
          git config user.name "backtest-bot"
          git config user.email "backtest-bot@users.noreply.github.com"
          git add reports/
          git diff --cached --quiet && exit 0
          git commit -m "Update research report [skip ci]"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && break; sleep 5; done
